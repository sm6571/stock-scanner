<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <script>(function(){var t=localStorage.getItem('scanner-theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.documentElement.setAttribute('data-bs-theme',t);})()</script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Scanner — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root,[data-theme="dark"]{--bg-primary:#0f1729;--bg-card:#162036;--bg-input:#0f1729;--border-color:#1e3054;--accent:#10b981;--text-primary:#e8eaf6;--text-muted:#7986cb;}
    [data-theme="light"]{--bg-primary:#f0f2f5;--bg-card:#fff;--bg-input:#f5f6fa;--border-color:#dde1e8;--accent:#059669;--text-primary:#1a1a2e;--text-muted:#6b7280;}
    body{background:var(--bg-primary);color:var(--text-primary);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .login-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:16px;padding:2.5rem;width:100%;max-width:400px;}
    .login-card h2{font-size:1.5rem;font-weight:700;margin-bottom:.3rem;}.subtitle{color:var(--text-muted);font-size:.85rem;margin-bottom:1.5rem;}
    .form-control{background:var(--bg-input);border:1px solid var(--border-color);color:var(--text-primary);}
    .form-control:focus{background:var(--bg-input);border-color:var(--accent);color:var(--text-primary);box-shadow:0 0 0 .2rem rgba(16,185,129,.2);}
    .form-control::placeholder{color:var(--text-muted);opacity:.6;}.form-label{font-size:.8rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
    .btn-accent{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600;}.btn-accent:hover{filter:brightness(.9);color:#000;}
    .toggle-link{color:var(--accent);cursor:pointer;font-size:.85rem;}.toggle-link:hover{text-decoration:underline;}
    .alert{font-size:.85rem;}
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center mb-3"><span style="font-size:2.5rem;">📊</span></div>
    <h2 class="text-center">Stock Scanner</h2>
    <p class="subtitle text-center" id="formSubtitle">Sign in to continue</p>
    <div id="alertBox" class="alert alert-danger" style="display:none;"></div>
    <form onsubmit="handleAuth(event)">
      <div class="mb-3"><label class="form-label">Username</label><input type="text" class="form-control" id="username" required autofocus></div>
      <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" id="password" required></div>
      <button type="submit" class="btn btn-accent w-100 mb-3" id="authBtn">Sign In</button>
    </form>
    <div class="text-center"><span id="toggleText">First time? </span><span class="toggle-link" onclick="toggleMode()">Create account</span></div>
  </div>
  <script>
    let isReg=false;
    fetch('/auth/status').then(r=>r.json()).then(s=>{if(s.authenticated){location.href='/';return;}if(s.needsSetup){isReg=true;document.getElementById('formSubtitle').textContent='Create your account';document.getElementById('authBtn').textContent='Create Account';}});
    function toggleMode(){isReg=!isReg;document.getElementById('formSubtitle').textContent=isReg?'Create your account':'Sign in to continue';document.getElementById('authBtn').textContent=isReg?'Create Account':'Sign In';document.getElementById('alertBox').style.display='none';}
    async function handleAuth(e){e.preventDefault();const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value,btn=document.getElementById('authBtn');btn.disabled=true;document.getElementById('alertBox').style.display='none';try{const r=await fetch(isReg?'/auth/register':'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});const d=await r.json();if(!r.ok){document.getElementById('alertBox').textContent=d.error;document.getElementById('alertBox').style.display='block';return;}location.href='/';}catch{document.getElementById('alertBox').textContent='Connection error';document.getElementById('alertBox').style.display='block';}finally{btn.disabled=false;}}
  </script>
</body></html>
