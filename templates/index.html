<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <script>(function(){var t=localStorage.getItem('scanner-theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.documentElement.setAttribute('data-bs-theme',t);})()</script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Scanner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container-fluid d-flex align-items-center">
      <span class="navbar-brand">📊 Stock Scanner</span>
      <div class="d-flex gap-2 align-items-center">
        <span class="scan-info" id="scanInfo">No scans yet</span>
        <button class="btn-icon" onclick="runScan()" id="scanBtn" title="Run Scan Now">🔍 Scan</button>
        <button class="btn-icon" onclick="toggleTheme()" title="Toggle theme">🌓</button>
        <span class="text-muted small" id="navUser"></span>
        <button class="btn-icon" onclick="logout()" title="Logout">🚪</button>
      </div>
    </div>
  </nav>

  <!-- Market Strip -->
  <div class="market-strip" id="marketStrip">
    <span class="text-muted small">Loading market data...</span>
  </div>

  <!-- Filter Bar -->
  <div class="filter-bar">
    <label>Sort:</label>
    <select id="sortBy" onchange="applyFilters()">
      <option value="score">Score</option>
      <option value="volume_ratio">Vol Ratio</option>
      <option value="atr_pct">ATR %</option>
      <option value="gap_pct">Gap %</option>
      <option value="change_pct">Change %</option>
      <option value="day_range_pct">Range %</option>
    </select>
    <label>Min Score:</label>
    <input type="number" id="minScore" value="20" min="0" max="100" style="width:60px;" onchange="applyFilters()">
    <label>Min Price:</label>
    <input type="number" id="minPrice" value="5" min="0" style="width:60px;" onchange="applyFilters()">
    <label>Sector:</label>
    <select id="sectorFilter" onchange="applyFilters()">
      <option value="">All</option>
    </select>
    <span style="flex:1"></span>
    <span class="scan-info" id="resultCount"></span>
  </div>

  <!-- Main Content -->
  <div class="container-fluid mt-3">
    <div class="row g-3">
      <!-- Results Table -->
      <div class="col-lg-9">
        <div class="card">
          <div class="card-body p-0" style="overflow-x:auto;">
            <table class="results-table" id="resultsTable">
              <thead>
                <tr>
                  <th onclick="sortCol('score')">Score</th>
                  <th onclick="sortCol('symbol')">Symbol</th>
                  <th class="hide-mobile" onclick="sortCol('name')">Name</th>
                  <th onclick="sortCol('price')">Price</th>
                  <th onclick="sortCol('change_pct')">Chg%</th>
                  <th onclick="sortCol('gap_pct')">Gap%</th>
                  <th onclick="sortCol('volume_ratio')">Vol Ratio</th>
                  <th class="hide-mobile" onclick="sortCol('volume')">Volume</th>
                  <th onclick="sortCol('atr_pct')">ATR%</th>
                  <th onclick="sortCol('day_range_pct')">Range%</th>
                  <th class="hide-mobile" onclick="sortCol('sector')">Sector</th>
                  <th>★</th>
                </tr>
              </thead>
              <tbody id="resultsBody"></tbody>
            </table>
            <div id="emptyState" class="text-center text-muted py-4">
              <div style="font-size:2rem;">📊</div>
              <div class="mt-2">No scan results yet. Click <strong>🔍 Scan</strong> to run your first scan.</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Sidebar: Watchlist -->
      <div class="col-lg-3">
        <div class="card mb-3">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h6 class="mb-0" style="font-size:.85rem;font-weight:700;">⭐ Watchlist</h6>
              <button class="btn-icon" style="font-size:.75rem;" onclick="openAddWatchlist()">+</button>
            </div>
            <div id="watchlistBody" style="max-height:300px;overflow-y:auto;">
              <div class="text-muted small text-center py-2">No stocks saved</div>
            </div>
          </div>
        </div>

        <!-- Scan History -->
        <div class="card">
          <div class="card-body">
            <h6 class="mb-2" style="font-size:.85rem;font-weight:700;">📜 Scan History</h6>
            <div id="scanHistory" style="max-height:250px;overflow-y:auto;">
              <div class="text-muted small text-center py-2">No scans yet</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add to Watchlist Modal -->
  <div class="modal fade" id="watchlistModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <div class="modal-header border-0"><h5 class="modal-title">Add to Watchlist</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="mb-3"><label class="form-label">Symbol</label><input type="text" class="form-control" id="wlSymbol" placeholder="AAPL" style="text-transform:uppercase;"></div>
          <div class="mb-3"><label class="form-label">Notes</label><input type="text" class="form-control" id="wlNotes" placeholder="Optional notes"></div>
        </div>
        <div class="modal-footer border-0"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-accent" onclick="addToWatchlist()">Add</button></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body></html>
